name: Weekly Travel Planner

on:
  schedule:
    # Every Monday at 9:00 AM US Pacific (UTC-7 summer / UTC-8 winter)
    # Summer: 0 16 * * 1  |  Winter: 0 17 * * 1
    # Using 16:00 UTC (9am PDT) — adjust to 17:00 UTC for PST (Nov–Mar)
    - cron: '0 16 * * 1'
  workflow_dispatch:  # Allow manual trigger for testing

jobs:
  generate-travel-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run travel planner
        env:
          # ── AI (required — Gemini is primary) ────────────────────────────
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}  # fallback
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}       # Optional: defaults to gemini-2.5-flash

          # ── Flights & Hotels: Travelpayouts (optional fallback) ──────────────
          # Cached data from Aviasales — works best with market=us for US routes.
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}

          # ── Amadeus Self-Service (free real-time flight data) ─────────────
          # Get free credentials at https://developers.amadeus.com
          # Set AMADEUS_ENV=production for live data (default: test)
          AMADEUS_API_KEY: ${{ secrets.AMADEUS_API_KEY }}
          AMADEUS_API_SECRET: ${{ secrets.AMADEUS_API_SECRET }}
          AMADEUS_ENV: ${{ secrets.AMADEUS_ENV }}

          # ── Kiwi/Tequila (optional alternative flight provider) ────────────
          KIWI_API_KEY: ${{ secrets.KIWI_API_KEY }}

          # ── Award seat search (optional) ───────────────────────────────────
          AWARD_FLIGHT_DAILY_KEY: ${{ secrets.AWARD_FLIGHT_DAILY_KEY }}   # Tier 1: free
          SEATS_AERO_API_KEY: ${{ secrets.SEATS_AERO_API_KEY }}           # Tier 2: $9.99/mo
          AWARD_PROVIDER: ${{ secrets.AWARD_PROVIDER }}   # "award_flight_daily" (default) or "seats_aero"

          # ── Balance sync (optional) ────────────────────────────────────────
          # Fetches live points from AwardWallet before planning each week.
          # Without this, balances from family_preferences.yaml are used.
          AWARDWALLET_TOKEN: ${{ secrets.AWARDWALLET_TOKEN }}

          # ── Weather (required) ─────────────────────────────────────────────
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}

          # ── Email (required) ───────────────────────────────────────────────
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

        run: python -m src.main

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: travel-planner-logs-${{ github.run_id }}
          path: travel_planner.log
          retention-days: 7
