# Sun Family Travel Preferences
# ─────────────────────────────────────────────────────────────────────────────
# Edit this file whenever your points balances change.
# If AwardWallet sync is set up, balances are overwritten automatically each run.

family:
  # SFO has more nonstop international routes; SJC is a shorter drive.
  # Change to "SJC" if you prefer — just note fewer nonstop options.
  home_airport: "SFO"
  adults: 2                 # You + wife
  children_ages: [2]        # One child, 2 years old (needs own seat)

trip:
  duration_min_days: 5
  duration_max_days: 5
  budget_usd: 7000          # Total for flights + hotel. Increased for international trips.
  max_flight_hours: 18.0    # Allow long-haul flights (SFO→Asia is 14-17h)
  prefer_nonstop: false     # OK with 1-stop connections; AI avoids long layovers

availability:
  # "anytime" — no school constraints yet with a 2-year-old.
  # Switch to "school_holidays_and_weekends" when kids start school.
  pattern: "school_holidays_and_weekends"
  exclude_dates: []
  lookahead_months: 6
  book_at_least_weeks_ahead: 3

dream_destinations:
  - name: "Banff National Park"
    iata: "YYC"
    duration_days: 4
  - name: "Tokyo"
    iata: "NRT"
    duration_days: 7
  - name: "Seoul"
    iata: "ICN"
    duration_days: 7
  - name: "Italy"
    iata: "FCO"
    duration_days: 7

destination_preferences:
  interests:
    - "beach"
    - "nature"
    - "toddler-friendly"
    - "family"
    - "culture"
  visa_free_only: true
  passport_countries:
    - "US"
  exclude_regions: []

hotels:
  star_rating_min: 3
  preferred_brands:
    - name: "Hyatt"
      loyalty_program: "World of Hyatt"
      points_balance: 90000

airlines:
  - name: "United Airlines"
    iata_code: "UA"
    loyalty_program: "United MileagePlus"
    points_balance: 60000

# Credit card flexible currencies — transferable to airlines and hotels.
# All transfer partners and ratios are built into the code automatically.
credit_cards:
  - name: "Amex Card"
    currency: "Amex Membership Rewards"
    points_balance: 200000
  - name: "Bilt Mastercard"
    currency: "Bilt Points"
    points_balance: 150000

# AwardWallet live balance sync (optional — see README for setup).
# When AWARDWALLET_TOKEN secret is present, all balances above are
# overwritten with live values each Monday before planning runs.
balance_sync:
  enabled: true

notifications:
  email:
    - "sunxingshu@gmail.com"
    - "kayla.mzhang@gmail.com"
